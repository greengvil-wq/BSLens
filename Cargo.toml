[package]
name = "bslens-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[features]
default = []
experimental-streaming-facts = ["experimental-snapshot-v5"]
experimental-snapshot-mcp = ["experimental-router", "experimental-snapshot-v5"]
experimental-v5-ingest = ["experimental-git"]
experimental-v5-reader = ["experimental-snapshot-v5"]
experimental-snapshot-v5 = ["experimental-pipeline", "experimental-v5-ingest", "rusqlite/blob"]
experimental-cache = ["experimental-pipeline"]
synthetic-dev = []
experimental-stdio = ["dep:serde"]
experimental-router = ["experimental-stdio", "experimental-pipeline"]
experimental-git = []
gitlab = ["experimental-git", "dep:roxmltree"]
experimental-lexical = []
experimental-xml = ["dep:roxmltree", "dep:quick-xml"]
experimental-tree = ["experimental-xml"]
experimental-pipeline = ["experimental-git", "experimental-tree", "experimental-lexical"]

[dependencies]
rusqlite = { version = "=0.32.1", features = ["bundled"] }
serde_json = "=1.0.140"
sha2 = "=0.10.8"
sha1 = "=0.10.6"
roxmltree = { version = "=0.20.0", optional = true }
quick-xml = { version = "=0.37.5", optional = true }

serde = { version = "=1.0.229", optional = true }

[[bin]]
name = "bslens-mcp"
path = "src/bin/bslens-mcp.rs"
required-features = ["experimental-router"]

[[bin]]
name = "bslens-v5"
path = "src/bin/bslens-v5.rs"
required-features = ["experimental-snapshot-v5"]
